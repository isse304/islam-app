services:
  - type: web
    name: nura-ai-backend
    env: node
    region: ohio  # Changed from frankfurt to ohio (closest to Chicago)
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DOMAIN
        value: www.nura-ai.app
      - key: MONGODB_URI
        sync: false  # Will be set manually in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVEN_LABS_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true  # Render will generate a random value
      - key: CORS_ORIGIN
        value: https://nura-ai-frontend.onrender.com,https://nura-ai.app
    autoDeploy: true 

  - type: web
    name: nura-ai-frontend
    env: node
    region: ohio
    buildCommand: |
      npm ci
      npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: NODE_VERSION
        value: 20.11.1
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVEN_LABS_KEY
        sync: false
      - key: STT_API_KEY
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false 