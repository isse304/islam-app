services:
  - type: web
    name: nura-ai-backend
    env: node
    region: frankfurt  # You can change this to a region closer to your users
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DOMAIN
        value: www.nura-ai.app
      - key: MONGODB_URI
        sync: false  # Will be set manually in Render dashboard
      - key: CLERK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVEN_LABS_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true  # Render will generate a random value
      - key: CORS_ORIGIN
        value: https://www.nura-ai.app
    autoDeploy: true 

  - type: web
    name: islam-app-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist/islam-app
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        sync: false
      - key: APP_DOMAIN
        value: https://www.nura-ai.app 