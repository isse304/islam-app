<!DOCTYPE html>
<html>
<head>
    <title>Auth Test - Components</title>
    <!-- Add meta for proper rendering -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Clerk script from dashboard -->
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="pk_test_cm9idXN0LWNyYXdkYWQtNDcuY2xlcmsuYWNjb3VudHMuZGV2JA"
        src="https://robust-crawdad-47.clerk.accounts.dev/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"
    ></script>
    
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
        .container { display: flex; flex-direction: column; gap: 20px; align-items: center; }
        .auth-methods { display: flex; gap: 10px; margin: 20px 0; }
        button { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .primary { background: #4f46e5; color: white; }
        .secondary { background: #e5e7eb; color: black; }
        pre { background: #f5f5f5; padding: 15px; border-radius: 5px; width: 100%; }
        .error { color: red; }
        .status { color: #666; font-size: 0.9em; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Auth Test - Components</h1>
        
        <!-- Status Message -->
        <div id="status-message" class="status">Initializing Clerk...</div>
        
        <!-- Sign In/Sign Up Container -->
        <div id="auth-container"></div>
        
        <!-- Auth Methods -->
        <div class="auth-methods">
            <button class="primary" onclick="showSignIn()" id="signin-btn" disabled>Sign In</button>
            <button class="primary" onclick="showSignUp()" id="signup-btn" disabled>Sign Up</button>
            <button class="secondary" onclick="signOut()" id="signout-btn" disabled>Sign Out</button>
        </div>

        <!-- Test API Call -->
        <div>
            <button class="primary" onclick="testAPI()" id="test-api-btn" disabled>Test Protected API</button>
        </div>

        <!-- User Info -->
        <div id="user-info">
            <h2>User Status</h2>
            <pre id="user-data">Loading...</pre>
        </div>

        <!-- Session Info -->
        <div id="session-info">
            <h2>Session Status</h2>
            <pre id="session-data">Loading...</pre>
        </div>

        <!-- API Response -->
        <div id="api-response">
            <h2>API Response</h2>
            <pre id="api-data">No API call made yet</pre>
        </div>
    </div>

    <script>
        let isClerkReady = false;

        function updateButtonStates() {
            const buttons = ['signin-btn', 'signup-btn', 'signout-btn', 'test-api-btn'];
            buttons.forEach(id => {
                const button = document.getElementById(id);
                button.disabled = !isClerkReady;
            });
        }

        // Wait for Clerk to be loaded
        window.addEventListener('load', async () => {
            try {
                const statusMessage = document.getElementById('status-message');
                statusMessage.textContent = 'Waiting for Clerk to initialize...';

                // Wait for Clerk to be available
                while (!window.Clerk) {
                    await new Promise(resolve => setTimeout(resolve, 100));
                }

                // Wait for Clerk to be ready
                await window.Clerk.load({
                    // The load method will ensure components are ready
                    afterSignInUrl: window.location.href,
                    afterSignUpUrl: window.location.href,
                });

                isClerkReady = true;
                updateButtonStates();
                statusMessage.textContent = 'Clerk is ready!';

                // Set up observers for auth state changes
                window.Clerk.addListener(({ user, session }) => {
                    updateUserInfo(user);
                    updateSessionInfo(session);
                });

                // Initial state
                updateUserInfo(window.Clerk.user);
                updateSessionInfo(window.Clerk.session);

            } catch (error) {
                console.error('Clerk initialization error:', error);
                document.getElementById('status-message').textContent = 'Failed to initialize Clerk';
                document.getElementById('auth-container').innerHTML = 
                    `<div class="error">
                        <h2>Authentication Error</h2>
                        <p>${error.message}</p>
                    </div>`;
            }
        });

        function updateUserInfo(user) {
            const userDataElement = document.getElementById('user-data');
            if (user) {
                const userData = {
                    id: user.id,
                    email: user.primaryEmailAddress?.emailAddress,
                    firstName: user.firstName,
                    lastName: user.lastName,
                    createdAt: user.createdAt
                };
                userDataElement.textContent = JSON.stringify(userData, null, 2);
            } else {
                userDataElement.textContent = 'No user signed in';
            }
        }

        function updateSessionInfo(session) {
            const sessionDataElement = document.getElementById('session-data');
            if (session) {
                const sessionData = {
                    id: session.id,
                    status: session.status,
                    expireAt: session.expireAt,
                    lastActiveAt: session.lastActiveAt
                };
                sessionDataElement.textContent = JSON.stringify(sessionData, null, 2);
            } else {
                sessionDataElement.textContent = 'No active session';
            }
        }

        async function testAPI() {
            if (!window.Clerk.session) {
                document.getElementById('api-data').textContent = 'Please sign in first';
                return;
            }

            try {
                const token = await window.Clerk.session.getToken();
                const response = await fetch('/api/ai/generate', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: 'Test prompt for AI generation'
                    }),
                    credentials: 'include'
                });

                const data = await response.json();
                document.getElementById('api-data').textContent = JSON.stringify(data, null, 2);
            } catch (error) {
                console.error('API test error:', error);
                document.getElementById('api-data').textContent = `Error: ${error.message}`;
            }
        }

        // Auth action handlers
        async function showSignIn() {
            if (!isClerkReady) {
                console.error('Clerk not ready');
                return;
            }
            try {
                await window.Clerk.openSignIn({
                    appearance: {
                        elements: {
                            formButtonPrimary: 'primary',
                            footerActionLink: 'secondary',
                            modalBackdrop: {
                                inert: true
                            }
                        },
                        layout: {
                            modalContentContainer: {
                                inert: false
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Sign in error:', error);
                document.getElementById('status-message').textContent = `Sign in error: ${error.message}`;
            }
        }

        async function showSignUp() {
            if (!isClerkReady) {
                console.error('Clerk not ready');
                return;
            }
            try {
                await window.Clerk.openSignUp({
                    appearance: {
                        elements: {
                            formButtonPrimary: 'primary',
                            footerActionLink: 'secondary',
                            modalBackdrop: {
                                inert: true
                            }
                        },
                        layout: {
                            modalContentContainer: {
                                inert: false
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Sign up error:', error);
                document.getElementById('status-message').textContent = `Sign up error: ${error.message}`;
            }
        }

        async function signOut() {
            if (!isClerkReady) {
                console.error('Clerk not ready');
                return;
            }
            try {
                await window.Clerk.signOut();
                document.getElementById('api-data').textContent = 'No API call made yet';
            } catch (error) {
                console.error('Sign out error:', error);
                document.getElementById('status-message').textContent = `Sign out error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
