<div class="usage-container p-4">
  <div class="mb-4">
    <h2 class="text-2xl font-bold mb-2">AI Usage</h2>
    <div class="status-banner p-4 rounded-lg mb-4" 
         [ngClass]="{
           'bg-green-100 text-green-800': usageLimits?.status === 'active',
           'bg-gray-100 text-gray-800': usageLimits?.status === 'free'
         }">
      <div class="font-semibold">
        {{ getStatusMessage() }}
      </div>
    </div>
  </div>

  <!-- AI Requests -->
  <div class="feature-card p-4 border rounded-lg">
    <h3 class="text-lg font-semibold mb-2">AI Requests</h3>
    <div class="progress-bar mb-2 bg-gray-200 rounded-full h-2">
      <div class="bg-blue-500 h-2 rounded-full" 
           [style.width]="getProgressWidth() + '%'">
      </div>
    </div>
    <p class="text-sm text-gray-600">
      {{ getUsedRequests() }} / {{ getTotalRequests() }} daily requests
    </p>
  </div>

  <div class="mt-6" *ngIf="usageLimits?.status === 'free'">
    <button 
      (click)="subscribe()"
      class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors">
      Upgrade to Premium
    </button>
  </div>
</div>

<!-- Loading state -->
<mat-progress-spinner *ngIf="loading" mode="indeterminate" diameter="40"></mat-progress-spinner>

<!-- Error state -->
<mat-card *ngIf="error" class="error-card">
  <mat-card-content>
    <mat-icon color="warn">error</mat-icon>
    <p>{{ error }}</p>
    <div class="actions">
      <button mat-button color="primary" (click)="fetchUsageLimits()">Try Again</button>
      <button mat-raised-button color="primary" *ngIf="error.includes('Premium')" (click)="subscribe()">
        Upgrade to Premium
      </button>
    </div>
  </mat-card-content>
</mat-card>

<!-- Usage data -->
<ng-container *ngIf="!loading && !error">
  <mat-card *ngIf="usageLimits" class="usage-card">
    <!-- ... existing code ... -->
  </mat-card>
</ng-container>
