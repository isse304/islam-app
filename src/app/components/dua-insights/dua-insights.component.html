<div class="insights-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="animate-spin rounded-full h-12 w-12 border-4 border-[#B7A57A] border-t-transparent"></div>
    <p class="text-[#B7A57A] mt-4">Generating insights...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error" class="error-state">
    <p class="text-red-600">{{ error }}</p>
  </div>

  <!-- Content -->
  <div *ngIf="!isLoading && !error" class="content">
    <!-- Tabs -->
    <div class="tabs">
      <button 
        [class.active]="activeTab === 'insights'"
        (click)="setActiveTab('insights')"
        class="tab-button">
        Insights
      </button>
      <button 
        [class.active]="activeTab === 'reflections'"
        (click)="setActiveTab('reflections')"
        class="tab-button">
        Reflections
      </button>
      <button 
        [class.active]="activeTab === 'context'"
        (click)="setActiveTab('context')"
        class="tab-button">
        Historical Context
      </button>
    </div>

    <!-- Insights Tab -->
    <div *ngIf="activeTab === 'insights'" class="tab-content">
      <div class="section">
        <h3 class="section-title">Explanation</h3>
        <p class="section-content">{{ insights?.explanation }}</p>
      </div>

      <div class="section" *ngIf="insights?.relatedVerses?.length">
        <h3 class="section-title">Related Verses & Hadith</h3>
        <ul class="list-disc pl-6">
          <li *ngFor="let verse of insights?.relatedVerses" class="mb-2">
            {{ verse }}
          </li>
        </ul>
      </div>

      <div class="section">
        <h3 class="section-title">Modern Application</h3>
        <p class="section-content">{{ insights?.modernApplication }}</p>
      </div>
    </div>

    <!-- Reflections Tab -->
    <div *ngIf="activeTab === 'reflections'" class="tab-content">
      <div class="section">
        <h3 class="section-title">Reflection Points</h3>
        <ul class="list-disc pl-6">
          <li *ngFor="let point of reflections?.reflectionPoints" class="mb-3">
            {{ point }}
          </li>
        </ul>
      </div>
    </div>

    <!-- Historical Context Tab -->
    <div *ngIf="activeTab === 'context'" class="tab-content">
      <div class="section">
        <h3 class="section-title">Historical Context</h3>
        <p class="section-content">{{ insights?.historicalContext }}</p>
      </div>
    </div>
  </div>
</div>
