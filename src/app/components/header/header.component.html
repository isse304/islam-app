<nav class="header-nav" *ngIf="!isLandingPage && showHeader">
  <div class="nav-container">
    <!-- Logo Section -->
    <div class="logo-container">
      <a routerLink="/" class="logo-link">
        <img src="nura-logo.png" alt="Nura" class="nura-logo">
      </a>
    </div>

    <!-- Navigation Links -->
    <div class="nav-links">
      <a routerLink="/home"
         routerLinkActive="nav-link-active"
         [routerLinkActiveOptions]="{exact: true}"
         class="nav-link">
        Home
      </a>
      <a routerLink="/quran"
         routerLinkActive="nav-link-active"
         class="nav-link">
        Quran Reader
      </a>
      <a routerLink="/learn"
         routerLinkActive="nav-link-active"
         class="nav-link">
         AI Tafsir Chat
      </a>
      <a routerLink="/dua"
         routerLinkActive="nav-link-active"
         class="nav-link">
        Dua
      </a>
      <a routerLink="/about" 
         routerLinkActive="nav-link-active"
         class="nav-link">
        About
       </a>
      <!-- Hide Profile link on mobile -->
      <a routerLink="/profile"
         routerLinkActive="nav-link-active"
         class="nav-link hide-on-mobile">
        Profile
      </a>
    </div>

    <!-- Upgrade Button (Desktop) - Show if authenticated & NOT premium -->
    <div class="upgrade-container hide-on-mobile" *ngIf="isAuthenticated && !isPremiumUser">
       <a routerLink="/subscription" class="upgrade-button">
         ☪️ Try Premium for 7 Days
       </a>
    </div>

    <!-- Auth Buttons -->
    <!-- Hide Auth buttons container on mobile -->
    <div class="auth-container hide-on-mobile">
      <app-auth-buttons></app-auth-buttons>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.mobile-menu-active]="isMobileMenuOpen">
    <a routerLink="/home" class="mobile-link" (click)="closeMobileMenu()">Home</a>
    <a routerLink="/quran" class="mobile-link" (click)="closeMobileMenu()">Quran Reader</a>
    <a routerLink="/learn" class="mobile-link" (click)="closeMobileMenu()">AI Tafsir Chat</a>
    <a routerLink="/dua" class="mobile-link" (click)="closeMobileMenu()">Dua</a>
    <a routerLink="/about" class="mobile-link" (click)="closeMobileMenu()">About</a>
    <a routerLink="/profile" class="mobile-link" (click)="closeMobileMenu()">Profile</a>
    <a routerLink="/contact" class="mobile-link" (click)="closeMobileMenu()">Contact Us</a>

    <!-- Upgrade Button (Mobile) - Show if authenticated & NOT premium -->
    <a *ngIf="isAuthenticated && !isPremiumUser" routerLink="/subscription" class="mobile-upgrade-link" (click)="closeMobileMenu()">
      ✨ Upgrade to Premium
    </a>

    <!-- Auth Buttons in Mobile Menu (Profile is already here, Sign Out is part of app-auth-buttons) -->
    <div class="mobile-auth-container">
      <app-auth-buttons></app-auth-buttons>
    </div>
  </div>
</nav>

<!-- Spacer to prevent content from hiding under fixed navbar -->
<div class="nav-spacer" *ngIf="!isLandingPage && showHeader"></div>
