<button mat-icon-button 
        [color]="currentTheme === 'dark' ? 'accent' : 'primary'" 
        (click)="cycleTheme()"
        [matTooltip]="getTooltip()"
        matTooltipPosition="below"
        aria-label="Toggle theme"
        class="theme-toggle-btn">
  <mat-icon>{{ getIcon() }}</mat-icon>
</button>
