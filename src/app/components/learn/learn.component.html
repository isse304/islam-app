<div class="min-h-screen bg-[#FAF3E0] py-8">
    <div class="container mx-auto p-4 sm:p-6 md:p-8 prose">
        <!-- Main Content Area (Render only AFTER initial premium check AND if user IS premium) -->
        <div class="grid lg:grid-cols-2 gap-8 h-[calc(100vh-4rem)] overflow-hidden" *ngIf="initialPremiumCheckComplete && isPremium">
            <!-- Left Column: Current Verse Section -->
            <div #verseDisplayContainer 
                 class="hidden lg:block rounded-xl shadow-lg p-6 overflow-y-auto custom-scrollbar"
                 [ngClass]="{ 'learn-verse-dark': (currentTheme$ | async) === 'dark' }">
                <!-- Verse Selection Controls MOVED OUTSIDE -->
                
                <div class="verse-meaning space-y-6"> 
                    <div class="arabic-verse">
                        <p class="text-right text-4xl leading-[2] font-uthmanic" dir="rtl">
                            {{ currentVerse }}
                        </p>
                    </div>
                    <div class="translation">
                        <p class="text-gray-800 text-lg leading-relaxed">
                            {{ translation }}
                        </p>
                    </div>
                </div>
            </div>

            <!-- Right Column (Chat & Controls) -->
            <div class="flex flex-col gap-6 h-full overflow-hidden">
              <!-- MOVED: Verse Selection Controls -->
              <div class="rounded-xl shadow-lg p-4 flex-shrink-0">
                <!-- Modified layout: Stack vertically on mobile -->
                <div class="flex flex-col md:flex-row items-stretch md:items-center gap-3">
                    <!-- Removed flex-1 from Surah select -->
                    <select [(ngModel)]="selectedSurah" 
                            (change)="updateVerseCount()"
                            class="p-2 border rounded-lg w-full md:w-auto">
                      <option *ngFor="let surah of surahs" [value]="surah.number">
                        {{surah.number}}. {{surah.englishName}}
                      </option>
                    </select>
                    
                    <div class="flex items-center gap-2">
                      <button (click)="previousVerse()" 
                              class="p-2 text-[#B7A57A] hover:bg-[#B7A57A15] rounded-lg"
                              [disabled]="selectedVerse <= 1"
                              matTooltip="Previous verse (←)">
                        <mat-icon>arrow_back</mat-icon>
                      </button>
                      
                      <select [(ngModel)]="selectedVerse" 
                              (change)="loadVerse()"
                              class="p-2 border rounded-lg w-20"
                              [attr.aria-label]="'Select verse'">
                        <option *ngFor="let verse of verseNumbers" [value]="verse">
                          {{verse}}
                        </option>
                      </select>
                      
                      <button (click)="nextVerse()"
                              class="p-2 text-[#B7A57A] hover:bg-[#B7A57A15] rounded-lg"
                              [disabled]="selectedVerse >= verseCounts"
                              matTooltip="Next verse (→)">
                        <mat-icon>arrow_forward</mat-icon>
                      </button>
                    </div>
                  </div>
              </div>

              <!-- Chat Interface -->
              <div class="rounded-xl shadow-lg p-4 flex flex-col flex-grow min-h-0">
                 <div class="flex justify-between items-center mb-4 flex-shrink-0">
                  <div class="flex items-center gap-4">
                    <h2 class="text-2xl font-semibold text-[#B7A57A] flex items-center">
                      <mat-icon class="mr-2">chat</mat-icon>
                      AI Tafsir Chat
                    </h2>
                    <select [(ngModel)]="selectedTafsir" 
                            (change)="onTafsirChange()"
                            class="p-2 border rounded-lg text-sm">
                      <option value="ibn-kathir">Ibn Kathir</option>
                      <option value="tabari">Al-Tabari</option>
                    </select>
                  </div>
                  <div class="flex items-center gap-2">
                    <button (click)="clearCache()" 
                            class="text-gray-500 hover:text-[#B7A57A] transition-colors"
                            matTooltip="Clear AI cache">
                      <mat-icon>cached</mat-icon>
                    </button>
                    <button (click)="clearChat()" 
                            class="text-gray-500 hover:text-red-500 transition-colors"
                            matTooltip="Clear chat history">
                      <mat-icon>delete_outline</mat-icon>
                    </button>
                  </div>
                </div>
                
                <div class="flex-1 overflow-y-auto p-2 space-y-4 custom-scrollbar" #chatContainer>
                  <!-- Chat messages display -->
                  <div *ngFor="let message of messages; let i = index" class="flex flex-col" [attr.id]="'message-' + i">
                      <div [ngClass]="message.role === 'user' ? 
                                      'ml-auto bg-[#B7A57A] text-white' : 
                                      'mr-auto bg-gradient-to-br from-[#FAF3E0] to-white'" 
                           class="rounded-2xl p-6 max-w-[85%] break-words shadow-lg hover:shadow-xl transition-all border border-[#B7A57A15]">
                        <div class="prose prose-lg max-w-none" 
                             [ngClass]="{
                               'prose-headings:text-[#B7A57A] prose-a:text-[#B7A57A] prose-strong:text-[#B7A57A] font-[Poppins]': message.role === 'assistant',
                               'prose-headings:text-[#1A365D] prose-a:text-[#1A365D] prose-strong:text-[#1A365D] text-[#1A365D]': message.role === 'user'
                             }"
                             [innerHTML]="message.content | markdown">
                        </div>
                        <div [ngClass]="message.role === 'user' ? 'text-white/70' : 'text-gray-500'"
                             class="text-xs mt-4 font-medium flex items-center gap-2">
                          <mat-icon class="text-sm">schedule</mat-icon>
                          {{ message.timestamp | date:'shortTime' }}
                        </div>
                      </div>
                    </div>
                  
                  <!-- Loading indicator specifically for chat responses -->
                  <div *ngIf="isLoading && initialPremiumCheckComplete" class="flex justify-center py-4">
                    <mat-spinner diameter="30" color="accent"></mat-spinner>
                  </div>
                </div>
        
                <div class="flex gap-2 mt-4 pt-1 border-t border-gray-100 flex-shrink-0">
                  <input type="text" 
                         [(ngModel)]="userQuestion"
                         (keyup.enter)="sendQuestion()"
                         placeholder="Ask about this verse..."
                         class="flex-1 p-3 border rounded-xl focus:outline-none focus:border-[#B7A57A] focus:ring-2 focus:ring-[#B7A57A15] transition-all">
                  <button (click)="sendQuestion()"
                          [disabled]="isLoading || !userQuestion.trim()"
                          class="bg-[#B7A57A] text-white px-6 py-3 rounded-xl hover:bg-[#9b8a65] transition-colors disabled:opacity-50 disabled:hover:bg-[#B7A57A] flex items-center gap-2">
                    <span class="hidden sm:inline">Send</span>
                    <mat-icon>send</mat-icon>
                  </button>
                </div>
              </div>
          </div>
        </div>
        
        <!-- Subscription Prompt (Render only AFTER initial premium check AND if user is NOT premium) -->
        <div *ngIf="initialPremiumCheckComplete && !isPremium" class="text-center py-20">
             <p class="text-lg text-gray-600">This feature requires a premium subscription.</p>
             <button mat-raised-button color="primary" routerLink="/subscription" class="mt-4">
               View Subscription Options
             </button>
        </div>
    </div>
</div>

<style>
.filter-blur {
  filter: blur(4px);
  pointer-events: none;
  user-select: none;
}
.premium-overlay {
  backdrop-filter: blur(4px);
}

.prose :where(h1, h2, h3, h4) {
  color: #B7A57A;
  margin-top: 1.5em;
  margin-bottom: 0.5em;
  font-family: 'Poppins', sans-serif;
  letter-spacing: -0.025em;
}

.prose :where(ul, ol) {
  padding-left: 1.5em;
  margin-top: 0.75em;
  margin-bottom: 0.75em;
}

.prose :where(li) {
  margin-top: 0.375em;
  margin-bottom: 0.375em;
  position: relative;
  padding-left: 0.5em;
}

.prose :where(p) {
  margin-top: 0.75em;
  margin-bottom: 0.75em;
  line-height: 1.8;
  font-family: 'Poppins', sans-serif;
}

.prose :where(blockquote) {
  border-left: 3px solid #B7A57A;
  padding: 1em 1.5em;
  background: #FAF3E0;
  border-radius: 0.5em;
  margin: 1.5em 0;
  font-style: italic;
  color: #4a5568;
}

.prose :where(strong) {
  color: #B7A57A;
  font-weight: 600;
}

.prose :where(a) {
  color: #B7A57A;
  text-decoration: none;
  border-bottom: 1px dashed #B7A57A;
  transition: all 0.2s;
}

.prose :where(a):hover {
  border-bottom: 1px solid #B7A57A;
}

.prose :where(code) {
  background: #FAF3E0;
  padding: 0.2em 0.4em;
  border-radius: 0.3em;
  font-size: 0.9em;
  color: #B7A57A;
}

/* Special styling for source citations */
.prose p:first-of-type {
  font-size: 1.1em;
  color: #B7A57A;
  font-weight: 500;
  padding: 0.5em 1em;
  background: #FAF3E015;
  border-radius: 0.5em;
  border-left: 3px solid #B7A57A;
}

/* Icons in headers */
.prose h2:before {
  content: '📖';
  margin-right: 0.5em;
}

.prose h3:before {
  content: '🔍';
  margin-right: 0.5em;
}

/* Beautiful list styling */
.prose ul {
  list-style: none;
}

.prose ul li:before {
  content: '•';
  color: #B7A57A;
  font-weight: bold;
  display: inline-block;
  width: 1em;
  margin-left: -1em;
}

.verse-header {
  font-family: 'Poppins', sans-serif;
  letter-spacing: 0.025em;
}

.chat-message-enter {
  opacity: 0;
  transform: translateY(10px);
}

.chat-message-enter-active {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 300ms, transform 300ms;
}

.custom-scrollbar {
  scrollbar-width: thin;
  scrollbar-color: #B7A57A #F3F4F6;
}

.custom-scrollbar::-webkit-scrollbar {
  width: 6px;
}

.custom-scrollbar::-webkit-scrollbar-track {
  background: #F3F4F6;
  border-radius: 8px;
}

.custom-scrollbar::-webkit-scrollbar-thumb {
  background-color: #B7A57A;
  border-radius: 8px;
}

/* Enhanced Markdown Styling */
.prose h2 {
  font-size: 1.25rem;
  font-weight: 600;
  margin-bottom: 1rem;
  padding-bottom: 0.5rem;
  border-bottom: 2px solid #B7A57A15;
}

.prose h2:first-child {
  margin-top: 0;
}

.prose p {
  margin-top: 0.75rem;
  margin-bottom: 0.75rem;
  line-height: 1.8;
}

.prose p:first-of-type {
  margin-top: 1rem;
}

.prose blockquote {
  margin: 1rem 0;
  padding: 0.5rem 1rem;
  border-left: 3px solid #B7A57A;
  background: #B7A57A15;
  border-radius: 0.25rem;
}

.prose ul {
  margin: 1rem 0;
  padding-left: 1.5rem;
}

.prose li {
  margin: 0.5rem 0;
}

.prose strong {
  font-weight: 600;
}

/* Special styling for source citations */
.prose p:first-of-type {
  font-size: 1.1em;
  font-weight: 500;
  padding: 0.75rem 1rem;
  background: #B7A57A15;
  border-radius: 0.5rem;
  border-left: 3px solid #B7A57A;
  margin-bottom: 1.5rem;
}

/* User message specific styling */
.prose.user-message {
  color: white;
}

.prose.user-message h2,
.prose.user-message strong,
.prose.user-message blockquote {
  color: white;
  border-color: rgba(255, 255, 255, 0.3);
}
</style>
