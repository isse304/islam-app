<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Reset Password</mat-card-title>
    </mat-card-header>
    
    <mat-card-content>
      <p class="reset-instructions" *ngIf="!resetEmailSent">
        Enter your email address and we'll send you a link to reset your password.
      </p>
      
      <div class="success-message" *ngIf="resetEmailSent">
        <mat-icon color="primary">check_circle</mat-icon>
        <p>A password reset link has been sent to your email address. Please check your inbox and follow the instructions.</p>
        <button mat-stroked-button color="primary" class="full-width" (click)="goToLogin()">
          Return to Sign In
        </button>
      </div>
      
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!resetEmailSent">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" placeholder="Email">
          <mat-error *ngIf="resetForm.get('email')?.hasError('required')">
            Email is required
          </mat-error>
          <mat-error *ngIf="resetForm.get('email')?.hasError('email')">
            Please enter a valid email address
          </mat-error>
        </mat-form-field>
        
        <div class="button-container">
          <button 
            mat-raised-button 
            color="primary" 
            type="submit" 
            class="full-width" 
            [disabled]="resetForm.invalid || isLoading">
            <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
            <span *ngIf="!isLoading">Send Reset Link</span>
          </button>
        </div>
        
        <div class="back-to-login">
          <a (click)="goToLogin()">Back to Sign In</a>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
