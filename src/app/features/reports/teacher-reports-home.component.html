<div class="p-8">
  <h1 class="text-3xl font-bold mb-6">Reports</h1>

  <form [formGroup]="filterForm" (ngSubmit)="generateReport()" class="bg-white p-4 rounded-lg shadow-md mb-8 flex gap-4 items-end">
    <div>
      <label class="label">Class</label>
      <select formControlName="classId" class="select select-bordered">
        <option *ngFor="let class of classes$ | async" [value]="class.id">{{ class.name }}</option>
      </select>
    </div>
    <div formGroupName="dateRange">
      <label class="label">Date Range</label>
      <div class="flex gap-2">
        <input type="date" formControlName="from" class="input input-bordered" />
        <input type="date" formControlName="to" class="input input-bordered" />
      </div>
    </div>
    <button type="submit" class="btn btn-primary">Generate Report</button>
  </form>

  <div *ngIf="reports$ | async as reports">
    <!-- Basic stats cards -->
    <div class="grid grid-cols-4 gap-4 mb-8">
      <!-- Add aggregation logic here -->
    </div>

    <!-- Chart -->
    <div class="bg-white p-4 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4">Completion Over Time</h2>
      <div style="display: block;">
        <canvas baseChart 
          [data]="lineChartData"
          [options]="lineChartOptions"
          [type]="lineChartType">
        </canvas>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white p-4 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Detailed Report</h2>
      <div class="flex justify-end mb-4 gap-2">
        <button (click)="exportAsCsv(reports)" class="btn btn-sm">Export CSV</button>
        <button (click)="exportAsPdf(reports)" class="btn btn-sm">Export PDF</button>
      </div>
      <table class="table w-full">
        <thead>
          <tr>
            <th>Student</th>
            <th>Assignments Completed</th>
            <th>Avg. Score</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let report of reports">
            <td>{{ report.studentId }}</td>
            <td>{{ report.metrics.assignmentsCompleted }} / {{ report.metrics.assignmentsAssigned }}</td>
            <td>{{ report.metrics.avgScore | number:'1.1-2' }}%</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
