<div id="app-container">
  <!-- Show a loading indicator while Clerk is initializing -->
  <div *ngIf="isLoading" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background-color: rgba(255, 255, 255, 0.8); z-index: 9999;">
    <div style="text-align: center;">
      <h2>Loading IslamApp...</h2>
      <p>Please wait while we initialize the application.</p>
    </div>
  </div>

  <!-- Show error message if initialization fails -->
  <div *ngIf="initError" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; align-items: center; background-color: rgba(255, 0, 0, 0.1); z-index: 9999;">
    <div style="text-align: center; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 80%;">
      <h2>Error Loading IslamApp</h2>
      <p>{{ initError }}</p>
      <button (click)="retryInitialization()" style="padding: 8px 16px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer;">Retry</button>
    </div>
  </div>

  <!-- Main app content -->
  <ng-container *ngIf="!initError">
    <app-header></app-header>
    <router-outlet></router-outlet>
  </ng-container>
</div>
