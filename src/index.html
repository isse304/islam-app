<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Nura AI</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="nura-logo.png">
  <!-- Arabic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Error Logging -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('Error:', { message: msg, url, line, col, error });
      return false;
    };
    // Add console logging for debugging
    console.log('Document loading...');
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded');
    });

    // Add specific Clerk error handling
    window.addEventListener('error', function(event) {
      if (event.filename && event.filename.includes('clerk')) {
        console.error('Clerk script error:', event);
      }
    });
  </script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- Material Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <!-- Add Stripe.js before your closing head tag -->
  <script src="https://js.stripe.com/v3/"></script>
  <!-- Add Clerk script with improved error handling -->
  <script>
    let clerkRetryCount = 0;
    const MAX_RETRIES = 3;
    
    function initializeClerk() {
      if (window.Clerk) {
        try {
          window.Clerk.load({
            // Set appearance
            appearance: {
              layout: {
                logoPlacement: 'inside',
                logoImageUrl: '/nura-logo.png',
                showOptionalFields: true
              },
              elements: {
                rootBox: {
                  boxShadow: 'none',
                  border: '1px solid #e5e7eb'
                }
              }
            }
          });
          console.log('Clerk initialized successfully');
        } catch (error) {
          console.error('Error initializing Clerk:', error);
          retryInitialization();
        }
      } else {
        console.log('Waiting for Clerk to be available...');
        setTimeout(initializeClerk, 100);
      }
    }

    function retryInitialization() {
      if (clerkRetryCount < MAX_RETRIES) {
        clerkRetryCount++;
        console.log(`Attempt ${clerkRetryCount} to initialize Clerk...`);
        setTimeout(initializeClerk, 1000 * clerkRetryCount);
      } else {
        console.error('Failed to initialize Clerk after maximum retries');
      }
    }

    // Load Clerk script
    const script = document.createElement('script');
    script.async = true;
    script.crossOrigin = 'anonymous';
    script.src = 'https://clerk.nura-ai.app/npm/@clerk/clerk-js@5/dist/clerk.browser.js';
    script.dataset.clerkPublishableKey = 'pk_live_Y2xlcmsubnVyYS1haS5hcHAk';
    script.type = 'text/javascript';
    script.onload = function() {
      console.log('Clerk script loaded successfully');
      initializeClerk();
    };
    script.onerror = function(error) {
      console.error('Error loading Clerk script:', error);
      if (clerkRetryCount < MAX_RETRIES) {
        clerkRetryCount++;
        setTimeout(() => {
          document.head.appendChild(script);
        }, 2000 * clerkRetryCount);
      }
    };
    document.head.appendChild(script);
  </script>
</head>
<body class="mat-typography">
  <app-root>Loading...</app-root>
</body>
</html>
