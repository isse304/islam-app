  <!-- Error Logging -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      if (msg === 'Script error.' && !url && !line && !col) {
        // Ignore generic script errors that don't have details
        return false;
      }
      console.error('Error:', { message: msg, url, line, col, error });
      return false;
    };
  </script>

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
