<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>IslamApp</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Arabic Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <!-- Error Logging -->
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error('Error:', { message: msg, url, line, col, error });
      return false;
    };
    // Add console logging for debugging
    console.log('Document loading...');
    document.addEventListener('DOMContentLoaded', function() {
      console.log('DOM Content Loaded');
    });

    // Add specific Clerk error handling
    window.addEventListener('error', function(event) {
      if (event.filename && event.filename.includes('clerk')) {
        console.error('Clerk script error:', event);
      }
    });
  </script>
  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
  <!-- Material Theme -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Icons" rel="stylesheet">
  <!-- Add Stripe.js before your closing head tag -->
  <script src="https://js.stripe.com/v3/"></script>
  <!-- Add Clerk script with error handling -->
  <script>
    // Create a fallback in case the Clerk script fails to load
    window.clerkScriptLoadTimeout = setTimeout(function() {
      console.error('Clerk script did not load within the timeout period');
      // You could add a UI notification here
    }, 10000); // 10 second timeout
    
    function onClerkScriptLoad() {
      console.log('Clerk script loaded successfully');
      clearTimeout(window.clerkScriptLoadTimeout);
    }
    
    function onClerkScriptError(error) {
      console.error('Error loading Clerk script:', error);
      clearTimeout(window.clerkScriptLoadTimeout);
    }
  </script>
  <script
    async
    crossorigin="anonymous"
    data-clerk-publishable-key="pk_live_Y2xlcmsubnVyYS1haS5hcHAk"
    src="https://clerk.nura-ai.app/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
    type="text/javascript"
    onload="onClerkScriptLoad()"
    onerror="onClerkScriptError(event)">
  </script>
</head>
<body class="mat-typography">
  <app-root>Loading...</app-root>
</body>
</html>
